server {
    listen 0.0.0.0:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Configure temp paths for read-only filesystem
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    
    # API proxying
    location /api/ {
        proxy_pass http://backend.healthcare-staging.svc.cluster.local:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # CORS headers for frontend-backend communication
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # Proxy to Grafana
    location /grafana/ {
        proxy_pass http://grafana-external.monitoring-staging.svc.cluster.local:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_unavailable;
    }

    # Proxy to Prometheus
    location /prometheus/ {
        proxy_pass http://prometheus-external.monitoring-staging.svc.cluster.local:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_unavailable;
    }

    # Proxy to Alertmanager
    location /alertmanager/ {
        proxy_pass http://alertmanager-external.monitoring-staging.svc.cluster.local:9093/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_unavailable;
    }

    # Service unavailable handler
    location @service_unavailable {
        return 503 '{"status":"service_unavailable","message":"Monitoring service is currently unavailable","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
    
    # API unavailable handler
    location @api_unavailable {
        return 503 '{"status":"api_unavailable","message":"Backend API is currently unavailable","timestamp":"$time_iso8601","endpoint":"$request_uri"}';
        add_header Content-Type application/json;
    }

    # Handle React routing
    location / {
        try_files $uri /index.html =404;

        # Basic cache control
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}