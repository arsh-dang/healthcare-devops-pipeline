server {
    listen 0.0.0.0:30285;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Enable DNS resolver for runtime hostname resolution
    resolver 127.0.0.11 valid=30s;
    
    # Configure temp paths for read-only filesystem
    client_body_temp_path /tmp/nginx_cache/client_temp;
    proxy_temp_path /tmp/nginx_cache/proxy_temp;
    fastcgi_temp_path /tmp/nginx_cache/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx_cache/uwsgi_temp;
    scgi_temp_path /tmp/nginx_cache/scgi_temp;
    
    # Static assets with proper MIME types - must come before catch-all
    location ~* ^/static/.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/javascript;
        try_files $uri =404;
    }
    
    location ~* ^/static/.*\.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type text/css;
        try_files $uri =404;
    }
    
    location ~* ^/static/.*\.json$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/json;
        try_files $uri =404;
    }
    
    location ~* ^/static/.*\.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Other static files
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Specific manifest file
    location = /manifest.json {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type application/json;
        try_files $uri =404;
    }    # API proxying
    location /api/ {
        proxy_pass http://backend:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable proxy buffering to avoid temp files
        proxy_buffering off;
    }

    # Monitoring services proxying
    location /grafana {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prometheus {
        proxy_pass http://prometheus:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /alertmanager {
        proxy_pass http://alertmanager:9093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jaeger {
        # Jaeger service not currently deployed
        # Uncomment and update IP when jaeger is available
        # proxy_pass http://jaeger-service-ip:16686;
        return 503 '{"error": "Jaeger service not available", "status": "service_unavailable"}';
        add_header Content-Type application/json;
    }

    # Health check endpoint for frontend
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"frontend","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Handle React routing - this must be last
    location / {
        # Only serve index.html for non-static files
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}