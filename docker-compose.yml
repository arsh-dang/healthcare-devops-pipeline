version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: healthcare-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-securepassword123}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-healthcare-app}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - healthcare-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: healthcare-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5001
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-securepassword123}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-healthcare-app}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:30285}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - healthcare-network
    volumes:
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: healthcare-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_BASE_URL: ${API_BASE_URL:-http://localhost:30285/api}
      REACT_APP_VERSION: ${REACT_APP_VERSION:-1.0.0}
      DD_RUM_ENABLED: ${DD_RUM_ENABLED:-false}
      DD_RUM_APPLICATION_ID: ${DD_RUM_APPLICATION_ID}
      DD_RUM_CLIENT_TOKEN: ${DD_RUM_CLIENT_TOKEN}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "30285:30285"
    depends_on:
      - backend
    networks:
      - healthcare-network
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - /app/node_modules
      - /app/build

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: healthcare-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - healthcare-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus/'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.0.0
    container_name: healthcare-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - healthcare-network
    depends_on:
      - prometheus

  # Jaeger Tracing (Optional)
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: healthcare-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - healthcare-network

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  healthcare-network:
    driver: bridge
