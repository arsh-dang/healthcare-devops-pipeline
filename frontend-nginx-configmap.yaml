apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config-new
  namespace: healthcare-staging
data:
  default.conf: |
    server {
        listen 0.0.0.0:30285;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Enable DNS resolver for runtime hostname resolution
        resolver 127.0.0.11 valid=30s;

        # Configure temp paths for read-only filesystem
        client_body_temp_path /tmp/nginx_cache/client_temp;
        proxy_temp_path /tmp/nginx_cache/proxy_temp;
        fastcgi_temp_path /tmp/nginx_cache/fastcgi_temp;
        uwsgi_temp_path /tmp/nginx_cache/uwsgi_temp;
        scgi_temp_path /tmp/nginx_cache/scgi_temp;

        # API proxying
        location /api {
            return 200 '{"status":"nginx working","message":"API endpoint reached"}';
            add_header Content-Type application/json;
        }

        # Health check endpoint for frontend
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"frontend","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # Proxy to Grafana
        location /grafana/ {
            proxy_pass http://grafana.monitoring-staging.svc.cluster.local:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # Proxy to Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus.monitoring-staging.svc.cluster.local:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # Proxy to Alertmanager
        location /alertmanager/ {
            proxy_pass http://alertmanager.monitoring-staging.svc.cluster.local:9093/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # Proxy to Jaeger
        location /jaeger/ {
            proxy_pass http://jaeger.monitoring-staging.svc.cluster.local:16686/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
            error_page 502 503 504 = @service_unavailable;
        }

        # Service unavailable handler
        location @service_unavailable {
            return 503 '{"status":"service_unavailable","message":"Monitoring service is currently unavailable","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # Service unavailable page
        location = /service-unavailable.html {
            return 200 '{"status":"service temporarily unavailable","message":"Monitoring service is starting up"}';
            add_header Content-Type application/json;
        }

        # Handle React routing
        location / {
            try_files $uri /index.html =404;

            # Basic cache control
            expires 1d;
            add_header Cache-Control "public, max-age=86400, immutable";
        }

        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
