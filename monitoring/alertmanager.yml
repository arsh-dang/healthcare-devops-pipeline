global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'healthcare-alerts@company.com'
  smtp_auth_username: 'healthcare-alerts@company.com'
  smtp_auth_password: 'your-smtp-password'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'healthcare-team'
  routes:
  - match:
      severity: critical
    receiver: 'healthcare-critical'
    continue: true
  - match:
      severity: warning
    receiver: 'healthcare-warning'
    continue: true
  - match:
      service: database
    receiver: 'database-team'
    continue: true
  - match:
      service: frontend
    receiver: 'frontend-team'
    continue: true
  - match:
      service: backend
    receiver: 'backend-team'
    continue: true

receivers:
- name: 'healthcare-critical'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#healthcare-critical'
    title: '{{ .GroupLabels.alertname }}'
    text: |
      CRITICAL ALERT
      *Alert:* {{ .GroupLabels.alertname }}
      *Severity:* {{ .GroupLabels.severity }}
      *Service:* {{ .GroupLabels.service }}
      *Instance:* {{ .Labels.instance }}
      *Description:* {{ .Annotations.description }}
      *Value:* {{ .Value }}
      *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
      *Environment:* Production
    color: 'danger'
  email_configs:
  - to: 'healthcare-critical@company.com'
    headers:
      Subject: 'CRITICAL: {{ .GroupLabels.alertname }} - {{ .GroupLabels.service }}'
    html: |
      <h1 style="color: #ff0000;">CRITICAL ALERT</h1>
      <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
      <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
      <p><strong>Service:</strong> {{ .GroupLabels.service }}</p>
      <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
      <p><strong>Description:</strong> {{ .Annotations.description }}</p>
      <p><strong>Value:</strong> {{ .Value }}</p>
      <p><strong>Time:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
      <p><strong>Environment:</strong> Production</p>
      <hr>
      <p><em>This is an automated alert from the Healthcare Application monitoring system.</em></p>

- name: 'healthcare-warning'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#healthcare-alerts'
    title: '{{ .GroupLabels.alertname }}'
    text: |
      WARNING ALERT
      *Alert:* {{ .GroupLabels.alertname }}
      *Severity:* {{ .GroupLabels.severity }}
      *Service:* {{ .GroupLabels.service }}
      *Instance:* {{ .Labels.instance }}
      *Description:* {{ .Annotations.description }}
      *Value:* {{ .Value }}
      *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
      *Environment:* Production
    color: 'warning'
  email_configs:
  - to: 'healthcare-alerts@company.com'
    headers:
      Subject: 'WARNING: {{ .GroupLabels.alertname }} - {{ .GroupLabels.service }}'

- name: 'healthcare-team'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#healthcare-notifications'
    title: '{{ .GroupLabels.alertname }}'
    text: |
      HEALTHCARE ALERT
      *Alert:* {{ .GroupLabels.alertname }}
      *Severity:* {{ .GroupLabels.severity }}
      *Service:* {{ .GroupLabels.service }}
      *Description:* {{ .Annotations.description }}
      *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    color: 'good'
  email_configs:
  - to: 'healthcare-team@company.com'
    headers:
      Subject: 'Alert: {{ .GroupLabels.alertname }} - {{ .GroupLabels.service }}'

- name: 'database-team'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#database-alerts'
    title: 'Database Alert: {{ .GroupLabels.alertname }}'
    text: |
      DATABASE ALERT
      *Alert:* {{ .GroupLabels.alertname }}
      *Severity:* {{ .GroupLabels.severity }}
      *Service:* {{ .GroupLabels.service }}
      *Instance:* {{ .Labels.instance }}
      *Description:* {{ .Annotations.description }}
      *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    color: 'danger'
  email_configs:
  - to: 'database-team@company.com'
    headers:
      Subject: 'Database Alert: {{ .GroupLabels.alertname }}'

- name: 'frontend-team'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#frontend-alerts'
    title: 'Frontend Alert: {{ .GroupLabels.alertname }}'
    text: |
      FRONTEND ALERT
      *Alert:* {{ .GroupLabels.alertname }}
      *Severity:* {{ .GroupLabels.severity }}
      *Service:* {{ .GroupLabels.service }}
      *Instance:* {{ .Labels.instance }}
      *Description:* {{ .Annotations.description }}
      *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    color: 'warning'
  email_configs:
  - to: 'frontend-team@company.com'
    headers:
      Subject: 'Frontend Alert: {{ .GroupLabels.alertname }}'

- name: 'backend-team'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#backend-alerts'
    title: 'Backend Alert: {{ .GroupLabels.alertname }}'
    text: |
      BACKEND ALERT
      *Alert:* {{ .GroupLabels.alertname }}
      *Severity:* {{ .GroupLabels.severity }}
      *Service:* {{ .GroupLabels.service }}
      *Instance:* {{ .Labels.instance }}
      *Description:* {{ .Annotations.description }}
      *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    color: 'warning'
  email_configs:
  - to: 'backend-team@company.com'
    headers:
      Subject: 'Backend Alert: {{ .GroupLabels.alertname }}'

inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'service']

- source_match:
    alertname: 'DatabaseDown'
  target_match:
    alertname: 'BackendServiceDown'
  equal: ['instance']
