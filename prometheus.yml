global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

rule_files:
- /etc/prometheus/rules/*.yml

scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: healthcare-backend
  kubernetes_sd_configs:
  - namespaces:
      names:
      - healthcare-staging
    role: endpoints
  relabel_configs:
  - action: keep
    regex: true
    source_labels:
    - __meta_kubernetes_service_annotation_prometheus_io_scrape
  - action: replace
    regex: (.+)
    source_labels:
    - __meta_kubernetes_service_annotation_prometheus_io_path
    target_label: __metrics_path__
  - action: replace
    regex: ([^:]+)(?::\d+)?(\d+)
    replacement: $1:$2
    source_labels:
    - __address__
    - __meta_kubernetes_service_annotation_prometheus_io_port
    target_label: __address__
- job_name: kubernetes-nodes
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - action: labelmap
    regex: __meta_kubernetes_node_label_(.+)
- job_name: mongodb-exporter
  kubernetes_sd_configs:
  - namespaces:
      names:
      - monitoring-staging
    role: endpoints
  relabel_configs:
  - action: keep
    regex: mongodb-exporter
    source_labels:
    - __meta_kubernetes_service_name
  - action: keep
    regex: metrics
    source_labels:
    - __meta_kubernetes_endpoint_port_name
- job_name: nginx-ingress-controller
  kubernetes_sd_configs:
  - namespaces:
      names:
      - monitoring-staging
    role: endpoints
  relabel_configs:
  - action: keep
    regex: ingress-nginx-controller
    source_labels:
    - __meta_kubernetes_service_name
  - action: keep
    regex: metrics
    source_labels:
    - __meta_kubernetes_endpoint_port_name
- job_name: jaeger
  kubernetes_sd_configs:
  - namespaces:
      names:
      - monitoring-staging
    role: endpoints
  metrics_path: /metrics
  relabel_configs:
  - action: keep
    regex: jaeger
    source_labels:
    - __meta_kubernetes_service_name
  - action: keep
    regex: query
    source_labels:
    - __meta_kubernetes_endpoint_port_name
