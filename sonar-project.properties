# SonarQube Project Configuration for Healthcare App
sonar.projectKey=healthcare-app
sonar.projectName=Healthcare App
sonar.projectVersion=1.0

# Source code location - only main sources, no tests
sonar.sources=src,server
sonar.tests=

# Exclude files and patterns
sonar.exclusions=node_modules/**,build/**,dist/**,coverage/**,*.min.js,**/node_modules/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js,**/*.test.jsx,**/*.spec.jsx

# SonarQube server configuration
sonar.host.url=http://localhost:9002
sonar.login=admin
sonar.password=Password@123

# Language settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true

# Additional settings
sonar.sourceEncoding=UTF-8
sonar.java.binaries=build/classes
sonar.java.libraries=build/libs/*.jar
